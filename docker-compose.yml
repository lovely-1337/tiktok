services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: launcher
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launcher -d launcher"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  